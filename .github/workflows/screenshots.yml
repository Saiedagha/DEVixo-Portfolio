name: Project screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Capture and analyse sites
        run: |
          mkdir -p shots
          cat > shoot.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const sites = {
            velcot: 'https://velcot.net', hayba: 'https://hayba.net', towntech: 'https://towntechshop.com',
            topaz: 'https://topazwebsite.myshopify.com', orin: 'https://orin-store.com', nushea: 'https://nushea.shop',
            eva: 'https://www.evafashioneg.com', amrgazzaz: 'https://amrgazzaz.com',
            elhamd: 'https://saiedagha.github.io/EL-hamd/', frid: 'https://saiedagha.github.io/fried-chicken-websit/',
            pastry: 'https://saiedagha.github.io/Western-Pastry-Chef-portfolio/', portfolio: 'https://saiedagha.github.io/my-portfolio/',
            zegimart: 'https://zegimart.ca/', bluetech: 'https://bluetech-kw.com/', glowbyrose: 'https://glowbyrose.shop/',
          };
          const hide = '[class*=popup],[class*=Popup],[id*=popup],[class*=newsletter-modal],[class*=cookie],[id*=shopify-pc__banner],[class*=klaviyo-form]{display:none!important}';
          const settle = async (p) => { await p.waitForTimeout(3000); await p.keyboard.press('Escape').catch(()=>{}); await p.addStyleTag({ content: hide }).catch(()=>{}); await p.waitForTimeout(700); };
          const b = await chromium.launch();
          const report = {};
          for (const [slug, url] of Object.entries(sites)) {
            const r = { url };
            try {
              const ctx = await b.newContext({ viewport: { width: 1440, height: 900 } });
              const p = await ctx.newPage();
              await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
              await settle(p);
              await p.screenshot({ path: `shots/${slug}.png` });
              r.finalUrl = p.url();
              r.info = await p.evaluate(() => {
                const txt = (s) => [...document.querySelectorAll(s)].map(e => e.innerText.trim().replace(/\s+/g,' ')).filter(Boolean);
                const html = document.documentElement.outerHTML;
                const sig = {
                  shopify: !!window.Shopify || html.includes('cdn.shopify.com'),
                  shopifyTheme: window.Shopify && window.Shopify.theme ? window.Shopify.theme.name : null,
                  woocommerce: html.includes('woocommerce'), wordpress: html.includes('wp-content'),
                  salla: html.includes('salla'), zid: html.includes('zid.store') || html.includes('zidcdn'),
                  easyorder: html.includes('easy-orders') || html.includes('easyorders'),
                  wix: html.includes('wixstatic'), nextjs: !!document.getElementById('__NEXT_DATA__') || html.includes('/_next/'),
                  react: !!document.querySelector('[data-reactroot],#root'), vite: html.includes('/assets/index-'),
                };
                const links = [...document.querySelectorAll('a[href]')].map(a => a.href);
                return {
                  title: document.title, lang: document.documentElement.lang, dir: document.documentElement.dir || getComputedStyle(document.body).direction,
                  description: document.querySelector('meta[name=description]')?.content || '',
                  nav: txt('header nav a, header a').slice(0, 25),
                  headings: txt('h1, h2').slice(0, 25),
                  buttons: txt('button, a.button, .btn').slice(0, 20),
                  footer: (document.querySelector('footer')?.innerText || '').replace(/\s+/g,' ').slice(0, 600),
                  currency: window.Shopify?.currency?.active || null,
                  locales: [...document.querySelectorAll('link[hreflang]')].map(l => l.hreflang),
                  hasWhatsapp: links.some(h => h.includes('wa.me') || h.includes('whatsapp')),
                  productLinks: links.filter(h => /\/products?\//.test(h)).slice(0, 5),
                  collectionLinks: links.filter(h => /\/collections\/|\/category|\/categories/.test(h)).slice(0, 5),
                  sig, textSample: document.body.innerText.replace(/\s+/g,' ').slice(0, 2500),
                };
              });
              const inner = r.info.productLinks[0] || r.info.collectionLinks[0];
              if (inner) {
                await p.goto(inner, { waitUntil: 'networkidle', timeout: 45000 }).catch(() => {});
                await settle(p);
                await p.screenshot({ path: `shots/${slug}-inner.png` });
                r.inner = { url: p.url(), title: await p.title(), text: (await p.evaluate(() => document.body.innerText)).replace(/\s+/g,' ').slice(0, 1500) };
              }
              await ctx.close();
              const m = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1' });
              const mp = await m.newPage();
              await mp.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
              await settle(mp);
              await mp.screenshot({ path: `shots/${slug}-m.png` });
              await m.close();
              console.log('ok', slug);
            } catch (e) { r.error = e.message; console.log('fail', slug, e.message); }
            report[slug] = r;
          }
          fs.writeFileSync('shots/report.json', JSON.stringify(report, null, 1));
          await b.close();
          JS
          node shoot.mjs
      - name: Push to screenshots branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq --cached .
          git add shots
          git commit -qm "Project screenshots"
          git push -f origin screenshots
