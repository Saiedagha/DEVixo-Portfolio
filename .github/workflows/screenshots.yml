name: Project screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Take screenshots
        run: |
          mkdir -p shots
          cat > shoot.mjs <<'JS'
          import { chromium } from 'playwright';
          const sites = {
            towntech: 'https://towntechshop.com',
            topaz: 'https://topazwebsite.myshopify.com',
            'orin-store': 'https://orin-store.com',
            nushea: 'https://nushea.shop',
            'eva-fashion': 'https://www.evafashioneg.com',
            'amr-gazzaz': 'https://amrgazzaz.com',
            'pastry-chef': 'https://saiedagha.github.io/Western-Pastry-Chef-portfolio/',
          };
          const b = await chromium.launch();
          for (const [slug, url] of Object.entries(sites)) {
            const p = await b.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            try {
              await p.goto(url, { waitUntil: 'networkidle', timeout: 45000 }).catch(() => {});
              await p.waitForTimeout(3000);
              await p.keyboard.press('Escape').catch(() => {});
              await p.addStyleTag({ content: '[class*=popup],[class*=Popup],[id*=popup],[class*=newsletter-modal],[class*=cookie],[id*=shopify-pc__banner]{display:none!important}' }).catch(() => {});
              await p.waitForTimeout(800);
              await p.screenshot({ path: `shots/${slug}.png` });
              console.log('ok', slug, p.url());
            } catch (e) { console.log('fail', slug, e.message); }
            await p.close();
          }
          await b.close();
          JS
          node shoot.mjs
      - name: Push to screenshots branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq --cached .
          git add shots
          git commit -qm "Project screenshots"
          git push -f origin screenshots
