name: Probe live site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for u in https://www.devixo-eg.site/ https://devixo-eg.site/ https://www.devixo-eg.site/en/; do
            echo "=== $u" >> out/probe.txt
            curl -sS -I "$u" >> out/probe.txt 2>&1
            curl -sSL "$u" | head -c 600 >> out/probe.txt
            echo >> out/probe.txt
          done
          dig +short www.devixo-eg.site devixo-eg.site >> out/probe.txt
          cd out && git init -q && git checkout -q -b probe && git add . && git -c user.name=a -c user.email=a@a commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
