name: Probe live site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for u in https://www.devixo-eg.site/sitemap.xml https://www.devixo-eg.site/sitemap.xml/ https://www.devixo-eg.site/robots.txt https://devixo-eg.site/sitemap.xml; do
            echo "=== $u" >> out/probe.txt
            curl -sS -o /dev/null -D - -A "Googlebot/2.1 (+http://www.google.com/bot.html)" "$u" >> out/probe.txt 2>&1
          done
          curl -sSL https://www.devixo-eg.site/sitemap.xml -o out/sitemap.xml
          curl -sSL https://www.devixo-eg.site/robots.txt -o out/robots.txt
          python3 -c "import xml.dom.minidom;s=open('out/sitemap.xml').read();d=xml.dom.minidom.parseString(s);print('live sitemap parses as XML, urls=',len(d.getElementsByTagName('url')),'xhtml=','xhtml' in s)" >> out/probe.txt 2>&1 || echo PARSE FAILED >> out/probe.txt
          cd out && git init -q && git checkout -q -b probe && git add . && git -c user.name=a -c user.email=a@a commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
